    "/v1/vault/init": {
      "post": {
        "operationId": "initVault",
        "tags": ["vault"],
        "summary": "First device creates the vault",
        "description": "Account session plus a signature by the new device key whose public key is in device.sig_pubkey (proof of possession). Idempotent on the raw request: the same vault_id, device_id, sig_pubkey and bundle text return the same 201; anything else is 409 vault_exists (§5.3 D4). 422 invalid_request also covers a bundle whose at, wraps[].createdAt or previous[].createdAt is not a multiple of 3600000 (§2.3, §0.0d N16) and any non-integer number token (§0.0d N20). device.name_ct.vkId must equal the envelope's vkId, else 422 invalid_request (§5.4, §0.0o A19).",
        "security": [{ "accountSession": [], "registrationSignature": [] }],
        "parameters": [{ "$ref": "#/components/parameters/SixkeyDevice" }, { "$ref": "#/components/parameters/SixkeyTs" }, { "$ref": "#/components/parameters/SixkeySig" }],
        "x-sixkey-doc": "§3.1 steps 5-7, §5.3",
        "x-sixkey-auth": { "signer": "registration", "account_session": "required", "pw_auth": "none", "write_proof": false, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 9437184,
        "x-sixkey-errors": { "401": ["session_invalid", "bad_signature", "clock_skew"], "409": ["vault_exists", "device_exists"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/InitRequest" } } } },
        "responses": {
          "201": { "description": "created (or the identical retry of a request that created it)", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/InitResponse" } } } },
          "401": { "$ref": "#/components/responses/Error" },
          "409": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
