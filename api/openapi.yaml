    "/v1/vault": {
      "get": {
        "operationId": "getVault",
        "tags": ["vault"],
        "summary": "Head envelope",
        "description": "Unconditional: no If-None-Match, ETag or 304. A version number can be reused after a rollback (D5), and §4.2 step 3 only fetches the head when needPull is already true, so a 304 could only be the wrong answer (§5.4 已删除, §0.0d N2).",
