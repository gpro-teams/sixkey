    "/v1/auth/verify": {
      "post": {
        "operationId": "authVerify",
        "tags": ["auth"],
        "summary": "Exchange the OTP for a one-time account session",
        "description": "Proxies Supabase POST /auth/v1/verify, then immediately revokes the Supabase session (POST /auth/v1/logout?scope=local) and returns only the access token. No refresh token ever reaches the extension (§0.3 C1, §5.2). If the immediate logout fails, verify answers 503 unavailable: it fails closed, the code is spent and the user requests a new one (§5.2, §0.0o A23).",
        "security": [],
        "x-sixkey-doc": "§3.1 step 2, §5.2, §5.5",
        "x-sixkey-auth": { "signer": "none", "account_session": "none", "pw_auth": "none", "write_proof": false, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 65536,
        "x-sixkey-errors": { "401": ["otp_invalid"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VerifyRequest" } } } },
        "responses": {
          "200": { "description": "account session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VerifyResponse" } } } },
          "401": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
          "429": { "$ref": "#/components/responses/Error" }
        }
      }
    },
