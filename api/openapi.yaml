        "x-sixkey-errors": { "413": ["too_large"] },
        "responses": {
          "200": { "description": "alive", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HealthResponse" } } } },
          "413": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/v1/auth/otp": {
      "post": {
        "operationId": "authOtp",
        "tags": ["auth"],
        "summary": "Send an email OTP",
        "description": "Proxies Supabase POST /auth/v1/otp {email, create_user: true}. Always 202 whether or not the email exists (§5.2).",
        "security": [],
        "x-sixkey-doc": "§3.1 step 2, §5.2, §5.5",
        "x-sixkey-auth": { "signer": "none", "account_session": "none", "pw_auth": "none", "write_proof": false, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 65536,
        "x-sixkey-errors": { "400": ["invalid_email"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OtpRequest" } } } },
        "responses": {
          "202": { "description": "accepted", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ServerTimeOnly" } } } },
          "400": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
