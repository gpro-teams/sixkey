      "put": {
        "operationId": "putKeys",
        "tags": ["keys"],
        "summary": "Change password and/or recovery code (same VK)",
        "description": "Exactly one of password_auth or recovery_auth (recovery-code reset, §3.3 step 5). Keyless server checks (§2.3): shape, vaultId, keyring.vkId = current vk_id, if_kver < kver <= if_kver + KVER_MAX_JUMP, else 422 invalid_request (jumps allowed up to KVER_MAX_JUMP; clients publish publishKver = min(max(server kver, maxSeenKver) + 1, server kver + KVER_MAX_JUMP), §2.3, §3.9 R1, §0.0e N27, §0.0f F-01), by = signing device, KDF bounds, and P4 consistency: recovery wrap changed <=> recovery_verifier present; password wrap changed <=> auth.kdf changed <=> password_verifier present; otherwise 422. A wrap changed when its iv or wrapped bytes did; createdAt and its other members do not count (§2.3, §0.0f S-2). The CAS is on if_kver: if it is not the server's current kver, 409 keys_conflict, unless the stored bundle text equals the submitted text byte for byte, which is the idempotent 200 whatever if_kver is (§3.6.0, §5.3). Same-VK repair (§4.2, R1 keys_behind, §0.0e N27): if_kver = the server's kver, the device's own keyring with a jumped kver, recovery_verifier from a typed recovery code, and password_verifier when the password wrap changes. 422 invalid_request also covers bundle times that are not multiples of 3600000 (§2.3, §0.0d N16) and non-integer number tokens (§0.0d N20). Check order (§5.3, §0.0o A5): 1. shape and the kver range (422); 2. a stored bundle text byte-identical to the submitted one is the idempotent 200, before any proof (a replay after success carries the replaced state's password_auth, and P4 against the identical stored bundle would demand no verifier); 3. the CAS precondition (409 keys_conflict), before the proof so an honest race is never counted as a wrong password; 4. password_auth or recovery_auth (403, counted); 5. vaultId, keyring.vkId, by and P4 (422); 6. the transaction.",
        "security": [{ "deviceSignature": [] }],
        "parameters": [{ "$ref": "#/components/parameters/SixkeyDevice" }, { "$ref": "#/components/parameters/SixkeyTs" }, { "$ref": "#/components/parameters/SixkeySig" }],
        "x-sixkey-doc": "§2.3, §3.3 step 5, §3.6, §3.7, §3.9 R1, §3.14, §4.2, §0.0e N27",
