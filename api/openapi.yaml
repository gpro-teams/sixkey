      },
      "KeysResponse": {
        "type": "object", "required": ["kver", "bundle", "server_time"],
        "properties": { "kver": { "$ref": "#/components/schemas/Kver" }, "bundle": { "$ref": "#/components/schemas/BundleText" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "PutKeysRequest": {
        "type": "object", "required": ["if_kver", "bundle"], "additionalProperties": false,
        "description": "Exactly one of password_auth and recovery_auth. Which verifiers are required follows the P4 consistency rule (§2.3).",
        "oneOf": [{ "required": ["password_auth"] }, { "required": ["recovery_auth"] }],
        "properties": {
          "if_kver": { "$ref": "#/components/schemas/Kver" },
          "bundle": { "$ref": "#/components/schemas/BundleText" },
          "password_auth": { "$ref": "#/components/schemas/PasswordAuth" },
          "recovery_auth": { "$ref": "#/components/schemas/B64Bytes32", "description": "recAuth (§3.3 step 5, S6)" },
          "recovery_verifier": { "$ref": "#/components/schemas/Verifier" },
          "password_verifier": { "$ref": "#/components/schemas/Verifier" }
        }
      },
      "KverResponse": {
        "type": "object", "required": ["kver", "server_time"],
        "properties": { "kver": { "$ref": "#/components/schemas/Kver" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "DeviceName": {
        "type": "object", "required": ["device_id", "name_ct"], "additionalProperties": false,
        "properties": { "device_id": { "$ref": "#/components/schemas/DeviceId" }, "name_ct": { "$ref": "#/components/schemas/NameCt" } }
      },
      "RotateRequest": {
        "type": "object",
        "required": ["if_version", "if_kver", "envelope", "write_proof", "new_write_key", "bundle", "password_auth", "recovery_verifier", "password_verifier", "device_names"],
        "additionalProperties": false,
        "properties": {
          "if_version": { "$ref": "#/components/schemas/Version" },
          "if_kver": { "$ref": "#/components/schemas/Kver" },
          "envelope": { "$ref": "#/components/schemas/EnvelopeText" },
          "write_proof": { "$ref": "#/components/schemas/B64Bytes32", "description": "with the current K_write" },
          "new_write_key": { "$ref": "#/components/schemas/B64Bytes32", "description": "K_write of the new VK" },
          "bundle": { "$ref": "#/components/schemas/BundleText" },
          "password_auth": { "$ref": "#/components/schemas/PasswordAuth" },
          "recovery_verifier": { "$ref": "#/components/schemas/Verifier" },
          "password_verifier": { "$ref": "#/components/schemas/Verifier", "description": "for the new auth salt" },
          "device_names": { "type": "array", "items": { "$ref": "#/components/schemas/DeviceName" }, "description": "every device of the account, revoked ones included, re-encrypted under the new VK (the client sends all it knows); the server requires devices of this account, no duplicates and name_ct.vkId = the new VK (else 422), and leaves the name_ct of unlisted devices unchanged (§5.3, §0.0o A6)" }
        }
      },
      "RotateResponse": {
        "type": "object", "required": ["version", "kver", "server_time"],
        "properties": { "version": { "$ref": "#/components/schemas/Version" }, "kver": { "$ref": "#/components/schemas/Kver" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "DeviceInfo": {
        "type": "object",
        "required": ["device_id", "name_ct", "joined_via", "approved_by", "created_at", "last_seen_at", "revoked_at", "auth_failures"],
        "properties": {
          "device_id": { "$ref": "#/components/schemas/DeviceId" },
          "name_ct": { "oneOf": [{ "$ref": "#/components/schemas/NameCt" }, { "type": "null" }] },
          "joined_via": { "$ref": "#/components/schemas/JoinedVia" },
          "approved_by": { "oneOf": [{ "$ref": "#/components/schemas/DeviceId" }, { "type": "null" }] },
          "created_at": { "$ref": "#/components/schemas/HourMs" },
          "last_seen_at": { "oneOf": [{ "$ref": "#/components/schemas/DayMs" }, { "type": "null" }] },
          "revoked_at": { "oneOf": [{ "$ref": "#/components/schemas/HourMs" }, { "type": "null" }] },
          "auth_failures": { "type": "integer", "minimum": 0, "maximum": 10 }
        }
      },
      "DevicesResponse": {
        "type": "object", "required": ["current", "devices", "server_time"],
        "properties": {
          "current": { "$ref": "#/components/schemas/DeviceId", "description": "the calling device" },
          "devices": { "type": "array", "items": { "$ref": "#/components/schemas/DeviceInfo" } },
          "server_time": { "$ref": "#/components/schemas/ServerTime" }
        }
      },
      "RenameRequest": {
        "type": "object", "required": ["name_ct", "password_auth"], "additionalProperties": false,
        "properties": { "name_ct": { "$ref": "#/components/schemas/NameCt" }, "password_auth": { "$ref": "#/components/schemas/PasswordAuth" } }
      },
      "RevokeResponse": {
        "type": "object", "required": ["revoked_at", "server_time"],
        "properties": { "revoked_at": { "$ref": "#/components/schemas/HourMs" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "ForkRequest": {
        "type": "object", "required": ["new_device_id", "new_sig_pubkey", "name_ct", "password_auth"], "additionalProperties": false,
        "properties": {
          "new_device_id": { "$ref": "#/components/schemas/DeviceId" },
          "new_sig_pubkey": { "$ref": "#/components/schemas/SpkiP256", "description": "the new key; Sixkey-New-Sig must verify with it" },
          "name_ct": { "$ref": "#/components/schemas/NameCt" },
          "password_auth": { "$ref": "#/components/schemas/PasswordAuth" }
        }
      },
      "DeviceIdResponse": {
        "type": "object", "required": ["device_id", "server_time"],
        "properties": { "device_id": { "$ref": "#/components/schemas/DeviceId" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "EnrollCreateRequest": {
        "type": "object", "required": ["device_id", "sig_pubkey", "commit"], "additionalProperties": false,
        "properties": {
          "device_id": { "$ref": "#/components/schemas/DeviceId" },
          "sig_pubkey": { "$ref": "#/components/schemas/SpkiP256" },
          "commit": { "$ref": "#/components/schemas/B64Bytes32", "description": "C = SHA-256('sixkey-enroll-commit|2|' devN '|' b64u(dpk_N) '|' b64u(epk_N) '|' b64u(n_N))" }
        }
      },
      "EnrollCreateResponse": {
        "type": "object", "required": ["request_id", "expires_at", "server_time"],
        "properties": { "request_id": { "$ref": "#/components/schemas/RequestId" }, "expires_at": { "$ref": "#/components/schemas/MinuteMs", "description": "(now + 600 s) rounded up to the UTC minute: the request lives 10 to 11 minutes (§5.3, §0.0o A13)" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "EnrollListItem": {
        "type": "object", "required": ["request_id", "created_at", "expires_at", "state"],
        "properties": {
          "request_id": { "$ref": "#/components/schemas/RequestId" },
          "created_at": { "$ref": "#/components/schemas/MinuteMs" },
          "expires_at": { "$ref": "#/components/schemas/MinuteMs" },
          "state": { "$ref": "#/components/schemas/EnrollState" },
          "handled_by": { "$ref": "#/components/schemas/DeviceId", "description": "the approver once someone responded" }
        }
      },
      "EnrollListResponse": {
        "type": "object", "required": ["requests", "server_time"],
        "properties": { "requests": { "type": "array", "items": { "$ref": "#/components/schemas/EnrollListItem" } }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "EnrollNewDeviceView": {
        "type": "object", "required": ["state", "server_time"],
        "description": "From responded on the view always carries approver_device_id and approver_epk, and approved also carries payload; a missing field aborts like a changed one (§3.2 MUST 1/2, §5.4, §0.0f F-10). Top-level required stays as §5.4 writes it.",
        "not": { "required": ["new_device_id"] },
        "allOf": [
          { "if": { "required": ["state"], "properties": { "state": { "enum": ["responded", "revealed", "approved"] } } }, "then": { "required": ["approver_device_id", "approver_epk"] } },
          { "if": { "required": ["state"], "properties": { "state": { "const": "approved" } } }, "then": { "required": ["payload"] } }
        ],
        "properties": {
          "state": { "$ref": "#/components/schemas/EnrollState" },
          "approver_device_id": { "$ref": "#/components/schemas/DeviceId" },
          "approver_epk": { "$ref": "#/components/schemas/EcPointP256" },
          "payload": { "$ref": "#/components/schemas/EnrollPayloadCiphertext" },
          "server_time": { "$ref": "#/components/schemas/ServerTime" }
        }
      },
      "EnrollApproverView": {
        "type": "object", "required": ["state", "new_device_id", "new_sig_pubkey", "commit", "server_time"],
        "description": "From revealed on the view always carries new_epk, new_nonce and new_name_ct; a missing field aborts like a changed one (§3.2 MUST 1, §5.4, §0.0f F-10). Top-level required stays as §5.4 writes it.",
        "allOf": [
          { "if": { "required": ["state"], "properties": { "state": { "enum": ["revealed", "approved"] } } }, "then": { "required": ["new_epk", "new_nonce", "new_name_ct"] } }
        ],
        "properties": {
          "state": { "$ref": "#/components/schemas/EnrollState" },
          "new_device_id": { "$ref": "#/components/schemas/DeviceId" },
          "new_sig_pubkey": { "$ref": "#/components/schemas/SpkiP256" },
          "commit": { "$ref": "#/components/schemas/B64Bytes32" },
          "new_epk": { "$ref": "#/components/schemas/EcPointP256" },
          "new_nonce": { "$ref": "#/components/schemas/B64Bytes32" },
          "new_name_ct": { "$ref": "#/components/schemas/EnrollNameCiphertext" },
          "server_time": { "$ref": "#/components/schemas/ServerTime" }
        }
      },
      "EnrollGetResponse": { "oneOf": [{ "$ref": "#/components/schemas/EnrollNewDeviceView" }, { "$ref": "#/components/schemas/EnrollApproverView" }] },
      "RespondRequest": {
        "type": "object", "required": ["epk", "password_auth"], "additionalProperties": false,
        "properties": { "epk": { "$ref": "#/components/schemas/EcPointP256" }, "password_auth": { "$ref": "#/components/schemas/PasswordAuth" } }
      },
      "RevealRequest": {
        "type": "object", "required": ["epk", "nonce", "name_ct"], "additionalProperties": false,
        "properties": { "epk": { "$ref": "#/components/schemas/EcPointP256" }, "nonce": { "$ref": "#/components/schemas/B64Bytes32" }, "name_ct": { "$ref": "#/components/schemas/EnrollNameCiphertext" } }
      },
      "ApproveRequest": {
        "type": "object", "required": ["transcript_hash", "payload", "name_ct", "sig_pubkey_sha256", "password_auth"], "additionalProperties": false,
        "properties": {
          "transcript_hash": { "$ref": "#/components/schemas/B64Bytes32" },
          "payload": { "$ref": "#/components/schemas/EnrollPayloadCiphertext" },
          "name_ct": { "$ref": "#/components/schemas/NameCt" },
          "sig_pubkey_sha256": { "$ref": "#/components/schemas/B64Bytes32" },
          "password_auth": { "$ref": "#/components/schemas/PasswordAuth" }
        }
      },
      "StateResponded": { "type": "object", "required": ["state", "server_time"], "properties": { "state": { "const": "responded" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } } },
      "StateRevealed": { "type": "object", "required": ["state", "server_time"], "properties": { "state": { "const": "revealed" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } } },
      "StateApproved": { "type": "object", "required": ["state", "server_time"], "properties": { "state": { "const": "approved" }, "server_time": { "$ref": "#/components/schemas/ServerTime" } } },
      "CompleteRequest": {
        "type": "object", "additionalProperties": false,
        "properties": { "name_ct": { "$ref": "#/components/schemas/NameCt", "description": "recovery path only, optional there (without it the device has a null name); on the approval path it is 422 (§5.3, §0.0o A16)" } }
      },
      "RejectRequest": {
        "type": "object", "additionalProperties": false,
        "properties": { "password_auth": { "$ref": "#/components/schemas/PasswordAuth", "description": "required when an enrolled device rejects; absent when the new device rejects its own request" } }
      },
      "RejectedResponse": {
        "type": "object", "required": ["rejected", "server_time"],
        "properties": { "rejected": { "type": "integer", "minimum": 0 }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "RecoveryEnrollRequest": {
        "type": "object", "required": ["device_id", "sig_pubkey", "recovery_auth"], "additionalProperties": false,
        "properties": {
          "device_id": { "$ref": "#/components/schemas/DeviceId" },
          "sig_pubkey": { "$ref": "#/components/schemas/SpkiP256" },
          "recovery_auth": { "$ref": "#/components/schemas/B64Bytes32", "description": "recAuth = HKDF(code128, empty, 'sixkey/v1/recovery-auth', 256)" }
        }
      },
      "RecoveryEnrollResponse": {
        "type": "object", "required": ["request_id", "vault_id", "version", "envelope", "kver", "bundle", "server_time"],
        "properties": {
          "request_id": { "$ref": "#/components/schemas/RequestId" },
          "vault_id": { "$ref": "#/components/schemas/VaultId" },
          "version": { "$ref": "#/components/schemas/Version" },
          "envelope": { "$ref": "#/components/schemas/EnvelopeText" },
          "kver": { "$ref": "#/components/schemas/Kver" },
          "bundle": { "$ref": "#/components/schemas/BundleText" },
          "server_time": { "$ref": "#/components/schemas/ServerTime" }
        }
      }
    }
  },
  "x-sixkey-signature": {
    "section": "§5.2",
    "signing_input": "sixkey-req|1|{host}|{METHOD}|{target}|{signer}|{sub}|{ts}|{base64url(SHA-256(body))}",
    "host": "the configured API host (URL.host: lowercase hostname, plus :port only when non-default), never the Host header seen behind a proxy (§5.2, §0.0d N9)",
    "target": "raw request target: path plus query string exactly as sent; the server rejects any target containing '|'",
    "signer": "deviceId (Sixkey-Device) or 'enroll:{rid}' (Sixkey-Enroll)",
    "sub": "JWT sub on the operations that carry an account session (the registration endpoints and DELETE /v1/account), otherwise '-' (§5.2, §5.4, §0.0o A20)",
    "ts": "decimal ms, identical to Sixkey-Ts",
    "body": "SHA-256 of the exact body bytes; a request with no body hashes zero bytes",
    "algorithm": "ECDSA P-256 / SHA-256, IEEE P1363 r||s (64 bytes), base64url without padding; the server checks 0 < r, s < n and converts to DER",
    "fork_new_key": "POST /v1/devices/fork also carries Sixkey-New-Sig: the new private key's signature over the same signing input, verified with the body's new_sig_pubkey (§4.10, §5.2, §0.0d N1)",
    "window_s": 300,
    "no_nonce_cache": "no nonce cache (§5.2): replays inside the window mostly hit optimistic locks, idempotency or one-shot state machines. Six residuals are accepted; each needs a captured TLS-protected signed request (with its pw_auth where required), and none exposes plaintext or breaks the vault's integrity: (1) a replayed rename undoes one newer rename; (2) a replayed reject-all deletes requests opened since, limited to the original's minute by created_at <= minute_floor(Sixkey-Ts); (3) a replayed DELETE /v1/vault/versions deletes history written since; (4) an enrollment create replayed after its request was rejected re-creates a pending ghost request with N's id, key and commitment, which the replayer cannot advance and which expires; (5) a recovery enrollment replayed after reject-all re-creates an approved recovery request and returns the envelope and bundle (ciphertext and wrapped keys) to the replayer; (6) signed GETs (/v1/vault, /v1/keys, history versions) replayed within 5 minutes return ciphertext and wrapped keys usable for offline password guessing, which the hosting rule never to log request headers or bodies prevents (§5.6). See §5.2, §1.2 A6 and §10 #93 (§0.0o A2).",
    "vectors": "contract/vectors/sync-v1.json groups.request_signature"
  },
