  "x-sixkey-request-rules": [
    { "id": "json_content_type", "applies_to": "with_request_body", "status": 422, "code": "invalid_request", "section": "§5.4 (§0.0p, §0.0r, M4 S6)", "source": "doc",
      "rule": "Every operation with a JSON request body requires a Content-Type header: the media type is application/json, case-insensitive, optionally followed by one parameter charset=utf-8 (case-insensitive), with optional whitespace around the ';'. charset=utf8, a quoted value, any other parameter, a trailing ';' and 'charset = utf-8' are 422. Clients send application/json (§9 M5). The server checks it before reading the body; otherwise 422 invalid_request, which every such operation lists. Reason: a web page can send a cross-site 'simple' request (text/plain, form types) without a CORS preflight, and this rule keeps such pages from triggering OTP mails or spending verify attempts (S6)." }
  ],
  "x-sixkey-rate-limits": {
    "rules": [
      "Requests rejected with 401 or 403 never count against any quota, with one exception: device_envelope_bytes keeps what the PUT /v1/vault and POST /v1/keys/rotate requests it applies to used (§5.5, §0.0p, §0.0r).",
      "A limit with unit bytes counts the whole request body's bytes, including a body that does not parse (422 or 413); every other limit counts requests.",
      "A request whose body does not parse carries no valid proof and pays every bucket that applies to it (device_writes, the account ceiling, device_envelope_bytes and account_envelope_bytes; for init, session_writes and session_envelope_bytes).",
      "A request carrying a valid password_auth or recovery_auth is exempt from every per-device limit; the server checks the proof before the limits (§3.14, S2).",
      "Only an invalid proof enters invalid_proof_per_device; past the limit the request gets 429 rate_limited with Retry-After and never touches the database (§5.5, §0.0o A10). No lockout, no backoff.",
      "An enrolling device (Sixkey-Enroll) is limited like a device keyed enroll:{rid} (device_writes, device_reads); it does not count toward account_reads or account_writes (§5.5, §0.0r A21).",
      "Revocation and rotation are not subject to account_writes (F8), but they are subject to proof_valid_account and account_envelope_bytes; an invalid proof never enters proof_valid_account, so a copy without the password cannot fill it (§5.5, §0.0p).",
      "Counters live in memory only: IP keys are HMAC(daily random key, IP) with TTL <= 1 h; daily per-email/account keys are HMAC(daily key, email or account) with TTL <= 24 h (§5.1, §5.6).",
      "An IP key counts an IPv4 address, or the /64 of an IPv6 address; an IPv4-mapped IPv6 address counts as its IPv4 address (§5.5, §0.0p, M4 S5).",
      "Each limiter table holds at most 200000 keys; a request that needs a new key once a table is full gets 429 rate_limited with Retry-After 60 (§5.5, §0.0p, §0.0r, M4 S5)."
    ],
    "limits": [
      { "id": "device_writes", "key": "device", "limit": 30, "window_s": 60, "applies_to": "device-signed non-GET requests (every write)", "section": "§5.5 (§0.0d N12)", "source": "doc" },
      { "id": "device_reads", "key": "device", "limit": 60, "window_s": 60, "applies_to": "device-signed GET requests, status included", "section": "§5.5", "source": "doc" },
      { "id": "account_writes", "key": "account", "limit": 600, "window_s": 60, "applies_to": "sum of device_writes over the account (20x a device)", "section": "§5.5", "source": "doc" },
      { "id": "account_reads", "key": "account", "limit": 1200, "window_s": 60, "applies_to": "sum of device_reads over the account (20x a device)", "section": "§5.5", "source": "doc" },
      { "id": "session_writes", "key": "account session", "limit": 30, "window_s": 60, "applies_to": "account-session non-GET requests: POST /v1/vault/init and POST /v1/enroll/requests", "section": "§5.5 (§0.0o A21)", "source": "doc" },
      { "id": "session_reads", "key": "account session", "limit": 60, "window_s": 60, "applies_to": "account-session GET requests: GET /v1/account", "section": "§5.5 (§0.0o A21)", "source": "doc" },
      { "id": "proof_valid_account", "key": "account", "limit": 60, "window_s": 60, "applies_to": "requests with a valid password_auth or recovery_auth (exempt from the per-device limits), revoke and rotate included; an invalid proof never enters it", "section": "§5.5 (§0.0p, M4 S2)", "source": "m4" },
      { "id": "device_envelope_bytes", "key": "device", "limit": 268435456, "window_s": 3600, "unit": "bytes", "applies_to": "PUT /v1/vault and POST /v1/keys/rotate requests without a valid proof, counted by the whole request body including bodies that fail to parse (422/413); never refunded", "section": "§5.5 (§0.0p, §0.0r, M4 S2, S4)", "source": "m4" },
      { "id": "account_envelope_bytes", "key": "account", "limit": 1073741824, "window_s": 3600, "unit": "bytes", "applies_to": "every PUT /v1/vault and POST /v1/keys/rotate request, valid proof or not, counted by the whole request body including bodies that fail to parse; refunded when the request ends in 401 or 403", "section": "§5.5 (§0.0p, §0.0r, M4 S2, S4)", "source": "m4" },
      { "id": "session_envelope_bytes", "key": "account session", "limit": 1073741824, "window_s": 3600, "unit": "bytes", "applies_to": "POST /v1/vault/init only, parsed or not, counted by the whole request body; refunded when the request ends in 401 or 403", "section": "§5.5 (§0.0r, M4 RR1)", "source": "m4" },
      { "id": "invalid_proof_per_device", "key": "device", "limit": 10, "window_s": 60, "applies_to": "requests with an invalid password_auth or recovery_auth", "section": "§3.14, §5.5", "source": "doc" },
      { "id": "otp_send_email_ip", "key": "email + IP-HMAC", "limit": 3, "window_s": 600, "applies_to": "POST /v1/auth/otp", "section": "§5.5", "source": "doc" },
      { "id": "otp_send_email_ip_day", "key": "email + IP-HMAC", "limit": 10, "window_s": 86400, "applies_to": "POST /v1/auth/otp", "section": "§5.5", "source": "doc" },
      { "id": "otp_send_email_day", "key": "email", "limit": 50, "window_s": 86400, "applies_to": "POST /v1/auth/otp", "section": "§5.5", "source": "doc" },
      { "id": "otp_send_ip", "key": "IP-HMAC", "limit": 20, "window_s": 3600, "applies_to": "POST /v1/auth/otp", "section": "§5.5", "source": "doc" },
      { "id": "otp_verify_code", "key": "email (HMAC), reset by a new code", "limit": 5, "window_s": null, "applies_to": "POST /v1/auth/verify: after 5 wrong attempts every verify for that email is 401 otp_invalid until a new code is sent; an attempt is taken before the provider is asked (S1); a malformed email is 401 otp_invalid too; if the counter table is full and this email has no counter yet, 429 rate_limited with Retry-After 60, and the provider is not asked", "section": "§5.5 (§0.0o A22, §0.0r)", "source": "doc" },
      { "id": "otp_verify_ip", "key": "IP-HMAC", "limit": 30, "window_s": 3600, "applies_to": "POST /v1/auth/verify", "section": "§5.5", "source": "doc" },
      { "id": "recovery_account_ip", "key": "account + IP-HMAC", "limit": 5, "window_s": 3600, "applies_to": "POST /v1/enroll/recovery", "section": "§5.5", "source": "doc" },
      { "id": "recovery_account_day", "key": "account", "limit": 50, "window_s": 86400, "applies_to": "POST /v1/enroll/recovery", "section": "§5.5", "source": "doc" },
      { "id": "pending_enrollments_per_session", "key": "account session", "limit": 1, "window_s": null, "applies_to": "POST /v1/enroll/requests (one pending at a time; 409 one_per_session)", "section": "§5.5", "source": "doc" },
      { "id": "active_devices", "key": "account", "limit": 200, "window_s": null, "applies_to": "unrevoked devices (409 too_many_devices)", "section": "§5.5", "source": "doc" }
    ]
  },
