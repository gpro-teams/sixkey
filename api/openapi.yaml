        }
      },
      "InitResponse": {
        "type": "object", "required": ["version", "kver", "server_time"],
        "properties": { "version": { "const": 1 }, "kver": { "const": 1 }, "server_time": { "$ref": "#/components/schemas/ServerTime" } }
      },
      "StatusResponse": {
        "type": "object",
        "required": ["version", "head", "vk_id", "kver", "pending_enrollments", "devices_rev", "min_client_version", "server_time"],
        "properties": {
          "version": { "$ref": "#/components/schemas/Version" },
          "head": { "$ref": "#/components/schemas/B64Bytes32", "description": "SHA-256 of the stored envelope text (D5)" },
          "vk_id": { "$ref": "#/components/schemas/VkId" },
          "kver": { "$ref": "#/components/schemas/Kver" },
          "pending_enrollments": { "type": "integer", "minimum": 0, "description": "unexpired approval requests in state pending; recovery-code requests never count (§5.4, §0.0o A14)" },
          "devices_rev": { "type": "integer", "minimum": 0, "description": "vaults.devices_rev: an opaque counter incremented in the same transaction as any devices-row change (join, revoke, rename, an auth_failures increase or its reset by a valid proof, rotate re-encryption; not cursor writes or last_seen_at; §0.0o A12). Compare for equality only; a change means GET /v1/devices (§4.2 step 1, §5.3, §0.0d N15)." },
          "min_client_version": { "type": "string", "pattern": "^[0-9]{1,5}(\\.[0-9]{1,5}){0,3}$", "description": "Chrome manifest version format, compared numerically per component, missing components count as 0 (§5.2, §0.0d N21)" },
          "server_time": { "$ref": "#/components/schemas/ServerTime" }
        }
      },
      "VaultResponse": {
        "type": "object", "required": ["version", "envelope", "server_time"],
