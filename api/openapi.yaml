        "description": "Called only after the new device has written its local state (and sk_sync_cfg). Creates the devices row (joined_via approval or recovery) and deletes the request with its payload. The first complete deletes the request row, so a retry of the same rid is 410 enroll_gone; after an unclear outcome the new device queries the status signed as devN, and 200 means it is enrolled (D4, §3.2 M7, §5.3, §0.0o A17). The idempotent 200 applies to another request (another session) completing the same device_id with the same public key in this account. If the device id was taken between create and complete (another account's init, a fork), the answer is 409 enroll_state and the request survives (§5.3, §0.0o A16). name_ct: the approval path already sent it in approve, and a name_ct here is 422; on the recovery path it is optional, and without it the device row gets a null name (§5.3). name_ct.vkId must equal the account's current vk_id, else 422 (§5.4, §0.0o A19).",
        "security": [{ "enrollSignature": [] }],
        "parameters": [{ "$ref": "#/components/parameters/RequestIdPath" }, { "$ref": "#/components/parameters/SixkeyEnroll" }, { "$ref": "#/components/parameters/SixkeyTs" }, { "$ref": "#/components/parameters/SixkeySig" }],
        "x-sixkey-doc": "§3.2 M7, §3.3 step 4, §5.3",
        "x-sixkey-auth": { "signer": "enroll", "account_session": "none", "pw_auth": "none", "write_proof": false, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 65536,
        "x-sixkey-errors": { "401": ["bad_signature", "clock_skew"], "409": ["enroll_state", "too_many_devices"], "410": ["enroll_gone"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CompleteRequest" } } } },
        "responses": {
          "200": { "description": "enrolled", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceIdResponse" } } } },
          "401": { "$ref": "#/components/responses/Error" },
          "409": { "$ref": "#/components/responses/Error" },
          "410": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
          "429": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/v1/enroll/requests/{rid}/reject": {
      "post": {
        "operationId": "rejectEnrollRequest",
        "tags": ["enroll"],
        "summary": "Reject one request (approver with pw_auth, or the new device itself)",
        "description": "An enrolled device must send password_auth (S8). The new device rejecting its own request (its payload does not open under K_enroll, bad_payload, MUST 5 / M6) signs with Sixkey-Enroll and sends no password_auth. An enrolled device that sends no password_auth gets 403 password_mismatch, not counted, since no guess was made (§5.4, §0.0o A11). Exactly one of Sixkey-Device and Sixkey-Enroll, and Sixkey-Enroll must equal the path rid; otherwise 401 bad_signature (§5.4, §0.0o A20).",
        "security": [{ "deviceSignature": [] }, { "enrollSignature": [] }],
        "parameters": [{ "$ref": "#/components/parameters/RequestIdPath" }, { "$ref": "#/components/parameters/SixkeyDeviceAlt" }, { "$ref": "#/components/parameters/SixkeyEnrollAlt" }, { "$ref": "#/components/parameters/SixkeyTs" }, { "$ref": "#/components/parameters/SixkeySig" }],
        "x-sixkey-doc": "§3.2 M6, §3.14",
        "x-sixkey-auth": { "signer": "device_or_enroll", "account_session": "none", "pw_auth": "device_only", "write_proof": false, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 65536,
        "x-sixkey-errors": { "401": ["bad_signature", "unknown_device", "clock_skew"], "403": ["password_mismatch", "device_revoked"], "410": ["enroll_gone"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RejectRequest" } } } },
        "responses": {
          "200": { "description": "rejected and deleted", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ServerTimeOnly" } } } },
          "401": { "$ref": "#/components/responses/Error" },
          "403": { "$ref": "#/components/responses/Error" },
          "410": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
          "429": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/v1/enroll/reject-all": {
      "post": {
        "operationId": "rejectAllEnrollRequests",
        "tags": ["enroll"],
        "summary": "Reject every open request of this account",
        "description": "Deletes the account's open requests, approval and recovery-code requests alike, whose created_at <= minute_floor(Sixkey-Ts) of this signed request; a replay inside the signature window can therefore only delete requests opened in the same minute as the original (§5.2 replay residual 2, §0.0o A2). rejected counts the deleted requests that had not expired (§5.4, §0.0o A14). Replaces the deleted 24-hour enrollment pause (decided Q11, §12). The bound is the client-signed Sixkey-Ts, not the server's clock, so clients must sign with the server-corrected time (§4.14): a device whose clock is 4 minutes slow would otherwise miss the requests of the last 4 minutes (§0.0p).",
        "security": [{ "deviceSignature": [] }],
        "parameters": [{ "$ref": "#/components/parameters/SixkeyDevice" }, { "$ref": "#/components/parameters/SixkeyTs" }, { "$ref": "#/components/parameters/SixkeySig" }],
        "x-sixkey-doc": "§0.0c, §5.5, §6 O8, §11 Q11",
        "x-sixkey-auth": { "signer": "device", "account_session": "none", "pw_auth": "required", "write_proof": false, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 65536,
        "x-sixkey-errors": { "401": ["bad_signature", "unknown_device", "clock_skew"], "403": ["password_mismatch", "device_revoked"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PasswordAuthOnly" } } } },
        "responses": {
          "200": { "description": "number rejected", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RejectedResponse" } } } },
          "401": { "$ref": "#/components/responses/Error" },
          "403": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
          "429": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/v1/enroll/recovery": {
      "post": {
        "operationId": "enrollWithRecovery",
        "tags": ["enroll"],
        "summary": "Self-service enrollment with the recovery code",
        "description": "Rate limit, then constant-time compare of SHA-256('sixkey-recovery-verifier|1|' || recovery_auth) with the stored verifier. On success creates an enrollment with via = recovery, state = approved, and returns the vault and bundle. A retry with the same device_id and public key inside the validity window returns the same result (§3.3).",
        "security": [{ "accountSession": [], "registrationSignature": [] }],
        "parameters": [{ "$ref": "#/components/parameters/SixkeyDevice" }, { "$ref": "#/components/parameters/SixkeyTs" }, { "$ref": "#/components/parameters/SixkeySig" }],
        "x-sixkey-doc": "§3.3 steps 3-4, §5.5",
        "x-sixkey-auth": { "signer": "registration", "account_session": "required", "pw_auth": "none", "write_proof": false, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 65536,
        "x-sixkey-errors": { "401": ["session_invalid", "bad_signature", "clock_skew"], "403": ["recovery_mismatch"], "404": ["no_vault"], "409": ["device_exists", "one_per_session"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecoveryEnrollRequest" } } } },
        "responses": {
          "200": { "description": "vault and bundle for the new device", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecoveryEnrollResponse" } } } },
          "401": { "$ref": "#/components/responses/Error" },
          "403": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "409": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
          "429": { "$ref": "#/components/responses/Error" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "accountSession": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Account session: the Supabase access token returned once by POST /v1/auth/verify as account_token (lifetime 900 s). The server verifies it with JWKS, algorithms = [ES256], aud, iss, exp, sub, and rejects is_anonymous; aud must be exactly the string authenticated (not a list) and role must be authenticated (§5.2, §0.0p, M4 I2); deleting the account also needs iat >= now - 600 (§5.2). Reading it grants no ciphertext and no wrapped key. Header name pinned by M0 (N10)."
      },
      "deviceSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "Sixkey-Sig",
        "description": "Enrolled device. Headers: Sixkey-Device: {deviceId}, Sixkey-Ts: {ms}, Sixkey-Sig: base64url(P1363 r||s). Key: devices.sig_pubkey. Server order (§5.2, P6): look up the device by primary key (absent: 401 unknown_device); verify the signature (bad: 401 bad_signature); revoked: 403 device_revoked; |ts - now| > 300 s: 401 clock_skew. All later queries use the device row's user_id.",
        "x-sixkey-signer": "deviceId"
      },
      "enrollSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "Sixkey-Sig",
        "description": "Device in the middle of enrolling. Headers: Sixkey-Enroll: {request_id}, Sixkey-Ts, Sixkey-Sig. Key: enrollments.new_sig_pubkey. Unknown or expired request: 410 enroll_gone. Sixkey-Enroll must equal the path rid, else 401 bad_signature (§5.4, §0.0o A20).",
        "x-sixkey-signer": "enroll:{rid}"
      },
      "registrationSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "Sixkey-Sig",
        "description": "Proof of possession for a key that is not registered yet (init, enrollment request, recovery enrollment). Headers: Sixkey-Device: {the device_id in the body}, Sixkey-Ts, Sixkey-Sig; verified with the sig_pubkey in the body; the request also carries the account session, so the signing input's sub is the JWT sub (§5.2, §0.0d N8).",
        "x-sixkey-signer": "deviceId (from the body)"
      }
    },
    "parameters": {
      "SixkeyDevice": { "name": "Sixkey-Device", "in": "header", "required": true, "description": "deviceId of the signer", "schema": { "$ref": "#/components/schemas/DeviceId" } },
      "SixkeyEnroll": { "name": "Sixkey-Enroll", "in": "header", "required": true, "description": "request_id of the enrollment the signer is in", "schema": { "$ref": "#/components/schemas/RequestId" } },
      "SixkeyDeviceAlt": { "name": "Sixkey-Device", "in": "header", "required": false, "description": "present when an enrolled device signs (exactly one of Sixkey-Device or Sixkey-Enroll)", "schema": { "$ref": "#/components/schemas/DeviceId" } },
      "SixkeyEnrollAlt": { "name": "Sixkey-Enroll", "in": "header", "required": false, "description": "present when the enrolling device signs (exactly one of Sixkey-Device or Sixkey-Enroll)", "schema": { "$ref": "#/components/schemas/RequestId" } },
      "SixkeyTs": { "name": "Sixkey-Ts", "in": "header", "required": true, "description": "client time in ms since the Unix epoch (corrected by the server offset, §4.14); must be within 300 s of the server clock", "schema": { "type": "string", "pattern": "^[0-9]{1,16}$" } },
      "SixkeyNewSig": { "name": "Sixkey-New-Sig", "in": "header", "required": true, "description": "POST /v1/devices/fork only: base64url (no padding) of the 64-byte P1363 signature by the NEW private key over exactly the same signing input as Sixkey-Sig; verified with the body's new_sig_pubkey. Missing or wrong: 401 bad_signature (§4.10, §5.2, §0.0d N1).", "schema": { "type": "string", "pattern": "^[A-Za-z0-9_-]{86}$" } },
      "SixkeySig": { "name": "Sixkey-Sig", "in": "header", "required": true, "description": "base64url (no padding) of the 64-byte IEEE P1363 ECDSA P-256 / SHA-256 signature over the signing input (x-sixkey-signature)", "schema": { "type": "string", "pattern": "^[A-Za-z0-9_-]{86}$" } },
      "DeviceIdPath": { "name": "id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/DeviceId" } },
      "RequestIdPath": { "name": "rid", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/RequestId" } },
      "VersionPath": { "name": "v", "in": "path", "required": true, "schema": { "type": "integer", "minimum": 1 } }
    },
    "headers": {
      "RetryAfter": { "description": "seconds to wait (429, 503; §4.8)", "schema": { "type": "integer", "minimum": 0 } }
    },
    "responses": {
      "Error": {
        "description": "Error body. The code determines the status (x-sixkey-error-codes); the operation's x-sixkey-errors lists the codes it can return.",
        "headers": { "Retry-After": { "$ref": "#/components/headers/RetryAfter" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorBody" } } }
      }
    },
    "schemas": {
      "ServerTime": { "type": "integer", "minimum": 0, "description": "server clock in ms since the Unix epoch; in every JSON response body (§5.4, §4.14). The only bodiless response, 204, relies on the Date header (§5.4, §0.0d N12)." },
      "Ms": { "type": "integer", "minimum": 0, "description": "ms since the Unix epoch" },
      "HourMs": { "type": "integer", "minimum": 0, "multipleOf": 3600000, "description": "ms since the Unix epoch, floored to the UTC hour (§2.3 T1, §5.3 C14, §0.0d N4); the server rejects bundle times that are not (§2.3, §0.0d N16)" },
      "MinuteMs": { "type": "integer", "minimum": 0, "multipleOf": 60000, "description": "ms since the Unix epoch, a multiple of 60000 ms (UTC minute boundary): created_at floored, expires_at rounded up (§5.3 C14, §0.0o A13)" },
      "DayMs": { "type": "integer", "minimum": 0, "multipleOf": 86400000, "description": "UTC midnight, ms since the Unix epoch (§5.4, §0.0d N14)" },
      "B64": { "type": "string", "pattern": "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$", "description": "standard base64 with padding (RFC 4648 §4)" },
      "B64Bytes12": { "type": "string", "pattern": "^[A-Za-z0-9+/]{16}$", "description": "12 bytes, standard base64 (AES-GCM iv)" },
      "B64Bytes16": { "type": "string", "pattern": "^[A-Za-z0-9+/]{22}==$", "description": "16 bytes, standard base64" },
      "B64Bytes32": { "type": "string", "pattern": "^[A-Za-z0-9+/]{43}=$", "description": "32 bytes, standard base64" },
      "B64Bytes48": { "type": "string", "pattern": "^[A-Za-z0-9+/]{64}$", "description": "48 bytes, standard base64 (wrapped VK: 32 + 16-byte tag)" },
      "DeviceId": { "type": "string", "pattern": "^[A-Za-z0-9_-]{22}$", "description": "16 random bytes, base64url without padding (§2.5)" },
      "VaultId": { "type": "string", "pattern": "^[A-Za-z0-9_-]{8,64}$", "description": "Phase 0 vaultId" },
      "VkId": { "type": "string", "pattern": "^[0-9a-f]{16}$", "description": "HKDF(VK, empty, 'sixkey/v1/vk-id', 64 bits), lowercase hex" },
      "RequestId": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "enrollment request id: lowercase hyphenated UUID, exactly as it appears in the transcript T" },
      "SpkiP256": { "type": "string", "pattern": "^MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE[A-Za-z0-9+/]{86}==$", "description": "P-256 public key as 91-byte SPKI DER with an uncompressed point, standard base64 (§2.2 dpk)" },
      "EcPointP256": { "type": "string", "pattern": "^B[A-Za-z0-9+/]{86}=$", "description": "P-256 public key as the 65-byte uncompressed point 0x04||x||y, standard base64 (§2.2 epk). WebCrypto and pyca also accept compressed points, so this check is not optional." },
      "Version": { "type": "integer", "minimum": 1 },
      "Kver": { "type": "integer", "minimum": 1, "maximum": 9007199254740991 },
      "PasswordAuth": { "$ref": "#/components/schemas/B64Bytes32", "description": "pw_auth (§3.14)" },
      "Verifier": { "$ref": "#/components/schemas/B64Bytes32" },
      "EnvelopeText": {
        "type": "string",
        "maxLength": 8388608,
        "contentMediaType": "application/json",
        "contentSchema": { "$ref": "#/components/schemas/EncryptedVault" },
        "description": "EncryptedVault as raw JSON text; the server stores this exact text, its UTF-8 byte count is size_bytes (<= MAX_ENVELOPE_BYTES) and SHA-256 of it is head (§4.1, §4.3, §5.3). The server checks the UTF-8 byte count first: over MAX_ENVELOPE_BYTES is 413 too_large, before the schema; maxLength (code points) is only the schema-level bound (§5.4, §0.0o A8). The text is parsed strictly: integer-only number tokens and no duplicate keys, NUL or lone surrogates (§5.4, §0.0o A18)."
      },
      "BundleText": {
        "type": "string",
        "maxLength": 65536,
        "contentMediaType": "application/json",
        "contentSchema": { "$ref": "#/components/schemas/KeyBundle" },
        "description": "KeyBundle as raw JSON text, stored without parse/re-serialize (§2.3, P11). The server also checks the raw text for non-integer number tokens (3.0, 1e3), which JSON parsing would hide (§2.3, §0.0d N20)."
      },
      "EncryptedVault": {
        "type": "object",
        "description": "Phase 0 envelope v1, unchanged (core/crypto/envelope.ts).",
        "required": ["format", "formatVersion", "cipher", "vaultId", "vkId", "rev", "iv", "ciphertext", "checksum"],
        "properties": {
          "format": { "const": "sixkey-vault" },
          "formatVersion": { "const": 1 },
          "cipher": { "const": "AES-256-GCM" },
          "vaultId": { "$ref": "#/components/schemas/VaultId" },
          "vkId": { "$ref": "#/components/schemas/VkId" },
          "rev": { "type": "integer", "minimum": 0 },
          "iv": { "$ref": "#/components/schemas/B64Bytes12" },
          "ciphertext": { "$ref": "#/components/schemas/B64" },
          "checksum": { "$ref": "#/components/schemas/B64Bytes32" }
        }
      },
      "Pbkdf2Params": {
        "type": "object",
        "required": ["name", "hash", "iterations", "salt", "v"],
        "properties": {
          "name": { "const": "PBKDF2" },
          "hash": { "const": "SHA-256" },
          "iterations": { "type": "integer", "minimum": 600000, "maximum": 20000000 },
          "salt": { "allOf": [{ "$ref": "#/components/schemas/B64" }, { "minLength": 24 }] },
          "v": { "const": 1 }
        }
      },
      "HkdfParams": {
        "type": "object",
        "required": ["name", "hash", "salt", "v"],
        "properties": {
          "name": { "const": "HKDF" },
          "hash": { "const": "SHA-256" },
          "salt": { "allOf": [{ "$ref": "#/components/schemas/B64" }, { "minLength": 24 }] },
          "v": { "const": 1 }
        }
      },
      "PasswordWrap": {
        "type": "object",
        "required": ["method", "vkId", "kdf", "iv", "wrapped", "createdAt"],
        "properties": {
          "method": { "const": "password" },
          "vkId": { "$ref": "#/components/schemas/VkId" },
          "kdf": { "$ref": "#/components/schemas/Pbkdf2Params" },
          "iv": { "$ref": "#/components/schemas/B64Bytes12" },
          "wrapped": { "$ref": "#/components/schemas/B64Bytes48" },
          "createdAt": { "$ref": "#/components/schemas/HourMs" }
        }
      },
      "RecoveryWrap": {
        "type": "object",
        "required": ["method", "vkId", "kdf", "iv", "wrapped", "createdAt"],
        "properties": {
          "method": { "const": "recovery" },
          "vkId": { "$ref": "#/components/schemas/VkId" },
          "kdf": { "$ref": "#/components/schemas/HkdfParams" },
          "iv": { "$ref": "#/components/schemas/B64Bytes12" },
          "wrapped": { "$ref": "#/components/schemas/B64Bytes48" },
          "createdAt": { "$ref": "#/components/schemas/HourMs" }
        }
      },
      "PreviousVk": {
        "type": "object",
        "required": ["vkId", "iv", "wrapped", "createdAt"],
        "properties": {
          "vkId": { "$ref": "#/components/schemas/VkId" },
          "iv": { "$ref": "#/components/schemas/B64Bytes12" },
          "wrapped": { "$ref": "#/components/schemas/B64Bytes48" },
          "createdAt": { "$ref": "#/components/schemas/HourMs" }
        }
      },
      "SyncKeyring": {
        "type": "object",
        "description": "Phase 0 keyring v1 with the sync constraints (§2.3, §3.13): wraps exactly {password, recovery}, no deviceKey, previous <= 64, times truncated to the hour. Unknown members are kept by clients (forward compatibility, §2.3).",
        "required": ["format", "v", "vaultId", "vkId", "wraps", "previous"],
        "properties": {
          "format": { "const": "sixkey-keyring" },
          "v": { "const": 1 },
          "vaultId": { "$ref": "#/components/schemas/VaultId" },
          "vkId": { "$ref": "#/components/schemas/VkId" },
          "wraps": {
            "type": "array",
            "minItems": 2,
            "maxItems": 2,
            "items": { "oneOf": [{ "$ref": "#/components/schemas/PasswordWrap" }, { "$ref": "#/components/schemas/RecoveryWrap" }] },
            "allOf": [
              { "contains": { "type": "object", "required": ["method"], "properties": { "method": { "const": "password" } } } },
              { "contains": { "type": "object", "required": ["method"], "properties": { "method": { "const": "recovery" } } } }
            ]
          },
          "deviceKey": false,
          "previous": { "type": "array", "maxItems": 64, "items": { "$ref": "#/components/schemas/PreviousVk" } }
        }
      },
      "KeyBundle": {
        "type": "object",
        "description": "§2.3. mac = base64(HMAC-SHA256(K_mac, 'sixkey-keybundle|1|' + canonicalJson(bundle without mac))), K_mac 256 bits. Unknown members are allowed and kept (they are under the MAC); a client that sees one refuses key operations. Not expressible here and checked in code: vaultId equals keyring.vaultId and the account's vault; keyring.vkId matches the current or new vk_id; if_kver < kver <= if_kver + KVER_MAX_JUMP (§2.3, §0.0e N27, §0.0f F-01); by equals the signing device; P4 consistency, wraps compared by iv and wrapped (§0.0f S-2).",
        "required": ["format", "v", "vaultId", "kver", "keyring", "auth", "by", "at", "mac"],
        "properties": {
          "format": { "const": "sixkey-keybundle" },
          "v": { "const": 1 },
          "vaultId": { "$ref": "#/components/schemas/VaultId" },
          "kver": { "$ref": "#/components/schemas/Kver" },
          "keyring": { "$ref": "#/components/schemas/SyncKeyring" },
          "auth": { "type": "object", "required": ["kdf"], "properties": { "kdf": { "$ref": "#/components/schemas/Pbkdf2Params" } } },
          "by": { "$ref": "#/components/schemas/DeviceId" },
          "at": { "$ref": "#/components/schemas/HourMs" },
          "mac": { "$ref": "#/components/schemas/B64Bytes32" }
        }
      },
      "NameCt": {
        "type": "object",
        "description": "Device name under K_name (§2.4): ct = AES-256-GCM(K_name(VK), name padded to 160 bytes, AAD 'sixkey-devname|1|{vaultId}|{vkId}|{deviceId}'), always 176 bytes. Member name vkId (§2.4, §5.3, §0.0d N6).",
        "required": ["vkId", "iv", "ct"],
        "additionalProperties": false,
        "properties": {
          "vkId": { "$ref": "#/components/schemas/VkId" },
          "iv": { "$ref": "#/components/schemas/B64Bytes12" },
          "ct": { "type": "string", "pattern": "^[A-Za-z0-9+/]{235}=$", "description": "176 bytes, standard base64" }
        }
      },
      "EnrollNameCiphertext": { "type": "string", "pattern": "^[A-Za-z0-9+/]{251}=$", "description": "base64(iv(12) || AES-GCM(K_enroll, name padded to 160 bytes) || tag(16)) = 188 bytes (§2.4, §3.2, §0.0d N5, N6)" },
      "EnrollPayloadCiphertext": { "allOf": [{ "$ref": "#/components/schemas/B64" }, { "minLength": 40, "maxLength": 60000 }], "description": "base64(iv(12) || AES-GCM(K_enroll, P, AAD 'sixkey-enroll-payload|2|' b64u(h)) || tag(16)) (§3.2 M5; P carries the bundle as its raw text, §0.0d N6, N7)" },
      "Cursor": {
        "type": "object",
        "description": "Clone soft detection, only exchanged in PUT /v1/vault (§4.10, T2). cur is absent on a device's first write (§5.4 PUT row, §0.0d N17).",
        "required": ["pending"],
        "additionalProperties": false,
        "properties": { "cur": { "$ref": "#/components/schemas/B64Bytes16" }, "pending": { "$ref": "#/components/schemas/B64Bytes16" } }
      },
      "EnrollState": { "type": "string", "enum": ["pending", "responded", "revealed", "approved"] },
      "JoinedVia": { "type": "string", "enum": ["first", "approval", "recovery", "fork"] },
      "ErrorCode": {
        "type": "string",
        "description": "Machine-readable table with status and meaning: x-sixkey-error-codes.",
        "enum": [
          "invalid_email", "invalid_request", "otp_invalid", "session_invalid", "step_up_required", "bad_signature", "unknown_device", "clock_skew",
          "device_revoked", "write_denied", "password_mismatch", "recovery_mismatch", "no_vault", "not_found", "vault_exists", "device_exists",
          "version_conflict", "vk_mismatch", "keys_conflict", "one_per_session", "enroll_state", "too_many_devices", "enroll_gone", "too_large",
          "key_mismatch", "rate_limited", "internal_error", "unavailable"
        ]
      },
      "ErrorBody": {
        "type": "object",
        "required": ["error", "server_time"],
        "properties": {
          "error": {
            "type": "object",
            "required": ["code"],
            "additionalProperties": false,
            "properties": {
              "code": { "$ref": "#/components/schemas/ErrorCode" },
              "retry_after": { "type": "integer", "minimum": 0, "description": "seconds (rate_limited, unavailable)" },
              "version": { "$ref": "#/components/schemas/Version", "description": "version_conflict: the server's current version" },
              "vk_id": { "$ref": "#/components/schemas/VkId", "description": "version_conflict: the server's current vk_id" },
              "kver": { "$ref": "#/components/schemas/Kver", "description": "version_conflict: the server's current kver" },
              "handled_by": { "$ref": "#/components/schemas/DeviceId", "description": "enroll_state: the device that already handled the request (F9)" }
            }
          },
          "server_time": { "$ref": "#/components/schemas/ServerTime" }
        }
      },
      "ServerTimeOnly": { "type": "object", "required": ["server_time"], "properties": { "server_time": { "$ref": "#/components/schemas/ServerTime" } } },
      "HealthResponse": { "type": "object", "required": ["ok", "server_time"], "properties": { "ok": { "const": true }, "server_time": { "$ref": "#/components/schemas/ServerTime" } } },
