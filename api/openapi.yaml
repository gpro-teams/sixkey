{
  "openapi": "3.1.0",
  "info": {
    "title": "Sixkey sync API",
    "version": "1.0.0-m0",
    "summary": "End-to-end encrypted vault sync for the Sixkey extension (Phase 1).",
    "description": "Contract for docs/SYNC-DESIGN.md §5 (revision 18), milestone M0. The design doc is the source of truth; revisions 5 and 6 (§0.0d, §0.0e) resolved every M0 note, revision 7 (§0.0f) the M1 review, revision 15 (§0.0o) the M4 backend review, revision 16 (§0.0p) its fix pass and revision 18 (§0.0r) its cleanup round, and x-sixkey-doc on each operation cites the sections it implements. The file is JSON syntax, which is valid YAML 1.2, so TypeScript and Python read it with their standard JSON parsers and no YAML dependency (§0.0d N0). Conventions (§5.4): bodies are JSON; envelope and bundle are JSON strings holding the raw text; other byte fields are standard base64; ids are base64url; every JSON response body carries server_time (ms). Error bodies are {error: {code, ...details}, server_time} and never echo user data. Request bodies reject unknown members (422); clients ignore unknown response members. Every number in a request body, a bundle or the enrollment payload is a safe integer written as an integer literal; the server rejects any other number token, such as 3.0 or 1e3, with 422 invalid_request (§2.3, §5.4, §0.0d N20). Strict JSON (§5.4, §0.0o A18): in a request body, a bundle or an envelope, a duplicate object key, a NUL character or a lone surrogate in any string is 422 invalid_request, and the integer-token rule also applies inside the envelope text. Every request body, on operations without one too, is capped (413 too_large, §5.4, §0.0o A9). Rules every request of a kind must follow, such as the JSON Content-Type, are in x-sixkey-request-rules."
  },
  "jsonSchemaDialect": "https://spec.openapis.org/oas/3.1/dialect/base",
  "servers": [
    { "url": "https://api.sixkey.app", "description": "production (the one host_permissions origin, §7)" },
    { "url": "http://127.0.0.1:8787", "description": "e2e (fixed port, §7)" }
  ],
  "tags": [
    { "name": "auth", "description": "Email OTP account session (§5.2)." },
    { "name": "vault", "description": "Encrypted vault and its history (§4, §5.3, §5.8)." },
    { "name": "keys", "description": "KeyBundle operations (§3.6-§3.9)." },
    { "name": "devices", "description": "Device list, rename, revoke, fork (§3.10, §4.10)." },
    { "name": "enroll", "description": "Approval and recovery-code enrollment (§3.2, §3.3)." },
    { "name": "account", "description": "Account state and deletion (§3.12, §5.7)." }
  ],
  "paths": {
