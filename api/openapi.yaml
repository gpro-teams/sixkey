      },
      "VerifyRequest": {
        "type": "object", "required": ["email", "token"], "additionalProperties": false,
        "properties": { "email": { "type": "string", "minLength": 3, "maxLength": 254 }, "token": { "type": "string", "pattern": "^[0-9]{6}$" } }
      },
