      },
      "AccountResponse": {
        "type": "object", "required": ["has_vault", "server_time"],
        "properties": {
          "has_vault": { "type": "boolean" },
          "vault_created_at": { "$ref": "#/components/schemas/HourMs" },
          "device_count": { "type": "integer", "minimum": 0 },
          "server_time": { "$ref": "#/components/schemas/ServerTime" }
        }
      },
      "InitDevice": {
        "type": "object", "required": ["device_id", "sig_pubkey", "name_ct"], "additionalProperties": false,
        "properties": { "device_id": { "$ref": "#/components/schemas/DeviceId" }, "sig_pubkey": { "$ref": "#/components/schemas/SpkiP256" }, "name_ct": { "$ref": "#/components/schemas/NameCt" } }
      },
      "InitRequest": {
        "type": "object",
        "required": ["vault_id", "envelope", "bundle", "recovery_verifier", "password_verifier", "write_key", "device"],
        "additionalProperties": false,
        "properties": {
          "vault_id": { "$ref": "#/components/schemas/VaultId" },
          "envelope": { "$ref": "#/components/schemas/EnvelopeText" },
          "bundle": { "$ref": "#/components/schemas/BundleText" },
