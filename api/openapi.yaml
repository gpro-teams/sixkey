      "put": {
        "operationId": "putVault",
        "tags": ["vault"],
        "summary": "Compare-and-swap a new head",
        "description": "Requires write_proof = HMAC(K_write, 'sixkey-write|1|{vaultId}|{if_version}|{envelope.checksum}') (§5.2). Checked before the transaction: proof, envelope.rev = if_version + 1, vaultId, vkId, checksum, size. The transaction locks the device row FOR NO KEY UPDATE, then CAS on version and vk_id (§5.3 C3; lock order device rows, vault row, enrollment rows, §5.3 A1). The cursor in the signed body drives clone detection (§4.10); forked = true means another copy of this identity wrote.",
        "security": [{ "deviceSignature": [] }],
        "parameters": [{ "$ref": "#/components/parameters/SixkeyDevice" }, { "$ref": "#/components/parameters/SixkeyTs" }, { "$ref": "#/components/parameters/SixkeySig" }],
        "x-sixkey-doc": "§4.2 step 6, §4.7, §4.10, §5.2, §5.3",
        "x-sixkey-auth": { "signer": "device", "account_session": "none", "pw_auth": "none", "write_proof": true, "new_key_proof": false },
        "x-sixkey-max-body-bytes": 9437184,
        "x-sixkey-errors": { "401": ["bad_signature", "unknown_device", "clock_skew"], "403": ["write_denied", "device_revoked"], "404": ["no_vault"], "409": ["version_conflict", "vk_mismatch"], "413": ["too_large"], "422": ["invalid_request"], "429": ["rate_limited"] },
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PutVaultRequest" } } } },
        "responses": {
          "200": { "description": "accepted", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PutVaultResponse" } } } },
          "401": { "$ref": "#/components/responses/Error" },
          "403": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "409": { "$ref": "#/components/responses/Error" },
          "413": { "$ref": "#/components/responses/Error" },
          "422": { "$ref": "#/components/responses/Error" },
          "429": { "$ref": "#/components/responses/Error" }
        }
      }
    },
