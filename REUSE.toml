# Which licence covers which file, for the REUSE specification (https://reuse.software/spec/, version 3.2 or later).
# LICENSE.md is the readable version of this map; the licence texts are in LICENSES/. `reuse lint` checks that every
# file is covered and that every licence named here has its text. No source file carries a licence header: this file
# is the one place the mapping lives.
#
# When several [[annotations]] match a file, the last one wins, so the general entries come first. "*" does not cross
# a "/", "**" does; root files are matched by the patterns without a directory.

version = 1
SPDX-PackageName = "Sixkey"
SPDX-PackageSupplier = "Organization: VIEW TECH LTD (security@g.pro)"

# Documents, everywhere: root community files, docs/, notes.
[[annotations]]
path = ["*.md", "**/*.md", "docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The browser extension: code, tests, scripts, pages, icons, messages. The dev-only WebAuthn probe in tools/ is
# extension code too.
[[annotations]]
path = ["extension/**", "tools/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "MPL-2.0"

# The sync server: code, tests, migrations, scripts, configuration.
[[annotations]]
path = ["api/server/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The contract's code: the vector generator, the consistency checker, the Python reference implementation.
[[annotations]]
path = ["contract/tools/**", "contract/py/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "Apache-2.0"

# The site rules of TOTP autofill (rules/): the rules, their fixtures, the tools, the upstream pins and exclusions, under
# the server's licence (the owner's D1). The bundle built from them, and Apple's files kept verbatim, are below.
[[annotations]]
path = ["rules/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Documents inside the component folders stay documents (the component entries above would otherwise win).
[[annotations]]
path = ["extension/**/*.md", "tools/**/*.md", "api/server/**/*.md", "contract/**/*.md", "rules/**/*.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The contract's data: the API description, the known-answer vectors and the site rules' JSON Schemas (TOTP autofill
# Stage 3: the format of rules/, whose rules and tools are AGPL-3.0-or-later), free for any implementation to reuse.
[[annotations]]
path = ["api/openapi.yaml", "contract/vectors/**", "contract/rules/1/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "CC0-1.0"

# The site rules' bundle, generated by rules/tools/bundle.mjs: our rules (AGPL-3.0-or-later) and the groups and hosts it
# takes from Apple's files (MIT), so both licences and both copyright lines (rules/NOTICE).
[[annotations]]
path = ["rules/build/**"]
precedence = "closest"
SPDX-FileCopyrightText = ["2026 VIEW TECH LTD and Sixkey contributors", "2020 - 2026 Apple Inc."]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

# Repository configuration and machine-written lock files.
[[annotations]]
path = [
  ".editorconfig",
  ".gitignore",
  "**/.gitignore",
  ".prettierignore",
  ".prettierrc.json",
  ".public-exclude",
  "ruff.toml",
  "REUSE.toml",
  ".github/**",
  "extension/package-lock.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "CC0-1.0"

# Generated from the dependency trees (extension/scripts/notices.mjs). The notices and licence texts it quotes keep
# their own terms, which the file states for each of them; CC0 covers only the compilation.
[[annotations]]
path = "THIRD-PARTY-NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 VIEW TECH LTD and Sixkey contributors"
SPDX-License-Identifier = "CC0-1.0"

# Third-party texts kept verbatim.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors (https://www.contributor-covenant.org)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "DCO.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Linux Foundation and its contributors (https://developercertificate.org/)"
SPDX-License-Identifier = "LicenseRef-DCO"

# Apple's password-manager-resources files, kept verbatim under rules/upstream/apple/ (their LICENSE.md included) and pinned
# by commit and SHA-256 in rules/upstream/SOURCES.json: Apple's copyright and licence, last so that nothing above wins.
[[annotations]]
path = "rules/upstream/apple/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 - 2026 Apple Inc."
SPDX-License-Identifier = "MIT"
